name: Publish racing games
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify release
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          for item in json.loads(Path("release-manifest.json").read_text()):
              target = Path("site") / item["path"]
              if "parts" in item:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with target.open("wb") as out:
                      for part in item["parts"]:
                          out.write(Path(part).read_bytes())
              assert target.stat().st_size == item["size"], item["path"]
              assert hashlib.sha256(target.read_bytes()).hexdigest() == item["sha256"], item["path"]
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
