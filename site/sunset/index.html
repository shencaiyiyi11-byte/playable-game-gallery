<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>落日海岸 · 五境疾驰</title><link rel="icon" href="game.icon.png"><style>
*{box-sizing:border-box}body{margin:0;background:#10151b;color:#eaf0f4;font:14px/1.5 "PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}header{height:54px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 22px;border-bottom:1px solid #ffffff20}a{color:#afbdc8;text-decoration:none}a:hover{color:white}strong{font-weight:500}button{font:inherit;color:#d7e4eb;background:#ffffff09;border:1px solid #ffffff30;padding:5px 13px;border-radius:5px;cursor:pointer}main{height:calc(100dvh - 92px);position:relative}iframe{display:block;width:100%;height:100%;border:0}footer{height:38px;padding:9px 18px;text-align:center;color:#8b9ba8;font-size:12px}.small{display:none}@media(max-width:700px){header{padding:0 12px}strong{font-size:13px}footer{font-size:10px}.desktop{display:none}.small{display:inline}}#play:fullscreen{height:100vh;width:100vw;background:#10151b}
</style></head><body><header><a href="../">← 选择风格</a><strong>落日海岸</strong><button id="fullscreen" type="button">全屏驾驶</button></header>
<main id="play"><iframe id="game" src="game.html" title="落日海岸赛车游戏" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe></main>
<footer><span class="desktop">Enter 开赛 · WASD / 方向键 驾驶 · 空格 漂移 · Shift 氮气 · E 道具 · R 回检查点 · Esc 暂停 · M 声音</span><span class="small">本游戏需要电脑键盘操作 · 首次加载请稍候</span></footer>
<script>const game=document.getElementById("game");document.getElementById("fullscreen").addEventListener("click",async()=>{try{if(!document.fullscreenElement)await document.getElementById("play").requestFullscreen();else await document.exitFullscreen();game.contentWindow.focus();}catch(e){document.getElementById("fullscreen").textContent="请使用浏览器全屏";}});game.addEventListener("load",()=>game.contentWindow.focus());</script></body></html>
